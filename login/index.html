<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <title>Anmelden · ZFC</title>
  <link rel="stylesheet" href="../assets/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/auth.js" defer></script>
</head>
<body class="portal">
  <main class="portal-login">
    <section class="portal-login-box">
      <a class="portal-brand" href="../index.html"><span class="portal-brand-mark">Z</span><span><strong>ZFC</strong><small>ZENITH FORMULA CHAMPIONSHIP</small></span></a>
      <p class="portal-kicker" style="margin-top:38px" data-login-kicker>Geschützter Bereich</p>
      <h1 data-login-title>Anmelden</h1>
      <p class="portal-muted" data-login-description>Du wirst anhand deiner hinterlegten Rolle zum passenden Arbeitsbereich weitergeleitet.</p>
      <form class="portal-form login-form" data-login-form>
        <label class="full">E-Mail-Adresse<input name="email" type="email" autocomplete="username" required></label>
        <label class="full">Passwort<input name="password" type="password" autocomplete="current-password" required></label>
        <div class="portal-actions full"><button class="portal-button primary" type="submit">Anmelden</button></div>
        <p class="portal-muted full" data-login-message role="status"></p>
      </form>
      <p style="margin-top:25px"><a class="portal-muted" href="../index.html">← Zur öffentlichen Website</a></p>
    </section>
  </main>
</body>
</html>
