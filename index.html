<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZFC · Team Finance Office</title><style>
:root{--bg:#0d1016;--panel:#151a23;--line:#29313e;--muted:#929eaf;--accent:#c7f36b;--text:#eef2f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui, sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#222b38;color:var(--text)}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#172010;border-color:var(--accent);font-weight:750}aside{position:fixed;width:235px;inset:0 auto 0 0;background:#11151d;border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:30px;font-weight:950;letter-spacing:-2px}.brand span{color:var(--accent)}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700;text-transform:uppercase}nav{margin-top:45px;display:grid;gap:8px}nav button{text-align:left;background:none;border-color:transparent;color:var(--muted);padding:13px}nav button.active{background:#c7f31315;color:var(--accent);border-color:#c7f33628}.aside-bottom{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.7}main{margin-left:235px;padding:30px 40px;max-width:1700px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:32px}.pill{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--accent)}.title{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px;gap:15px}h1{font-size:34px;letter-spacing:-1px;margin:7px 0}p{color:var(--muted);line-height:1.6;margin:5px 0}h2{font-size:17px;margin:0 0 18px}h3{margin:0;font-size:17px}.hero{position:relative;overflow:hidden;border:1px solid #465638;background:linear-gradient(105deg,#253623,#182120 65%,#263d29);padding:30px;border-radius:14px;margin-bottom:25px}.hero:after{content:'ZFC';position:absolute;right:30px;top:-30px;font-size:160px;font-weight:950;opacity:.06;font-style:italic}.hero h2{font-size:26px;margin:9px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.stat,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.stat strong{display:block;font-size:25px;margin:12px 0 6px;letter-spacing:-.7px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card{border-top:3px solid var(--team);display:flex;flex-direction:column;gap:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{display:inline-grid;place-items:center;width:42px;height:42px;background:var(--team);color:#10151a;border-radius:9px;font-weight:900}.balance{font-size:26px;font-weight:750;letter-spacing:-.7px}.bar{background:#29313c;height:7px;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}td,th{padding:16px 10px;border-bottom:1px solid var(--line)}td{font-size:13px}.table-wrap{overflow:auto}.positive{color:var(--accent)}.negative{color:#ff9090}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select{background:#10151d;border:1px solid #364153;color:var(--text);padding:11px;border-radius:7px;min-width:0}input:focus,select:focus{outline:2px solid #c7f37070}label{display:grid;gap:7px;color:var(--muted);font-size:12px;margin:14px 0}.empty{padding:35px;text-align:center;color:var(--muted)}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{border-left:3px solid var(--accent);padding:12px 16px;background:#c7f30808;color:var(--muted);line-height:1.6;margin-top:20px}dialog{background:var(--panel);color:var(--text);border:1px solid #465265;border-radius:14px;padding:25px;width:min(520px,94vw);max-height:90vh}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}dialog h2{font-size:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.toast{position:fixed;bottom:25px;right:25px;background:var(--accent);color:#172010;padding:15px 22px;border-radius:10px;z-index:10;display:none}footer{margin-top:30px;font-size:11px;color:var(--muted)}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:750px){aside{position:static;width:auto;padding:16px}.brand{font-size:25px}nav{display:flex;overflow:auto;margin-top:15px;gap:3px}nav button{white-space:nowrap}.aside-bottom{display:none}main{margin:0;padding:20px 16px}.grid{grid-template-columns:1fr}header{margin-bottom:20px}.title{align-items:start;flex-direction:column}h1{font-size:28px}.stat{padding:16px}.stat strong{font-size:21px}.hero{padding:22px}.formgrid{grid-template-columns:1fr}}
</style></head><body><aside><div class="brand">ZFC<span> /</span></div><div class="eyebrow">Team Finance Office</div><nav id="nav"></nav><div class="aside-bottom"><span class="pill">● &nbsp; Lokaler Arbeitsbereich</span><p>Teams. Talente. Finanzen.<br>Eine zentrale Übersicht.</p><hr style="border:0;border-top:1px solid var(--line)">Demo-Vorlage · frei bearbeitbar</div></aside><main><header><div class="eyebrow">League Management / Control Center</div><span class="pill">SAISON 2026</span></header><div id="app"></div><footer>ZFC TEAM FINANCE OFFICE · Virtuelle Ligakonten · Daten werden nur in diesem Browser gespeichert.</footer></main><dialog id="modal"><form id="form"><div class="row"><h2 id="modalTitle"></h2><button type="button" onclick="modal.close()" aria-label="Schließen">✕</button></div><div id="fields"></div><p id="error" class="negative"></p><div class="actions" style="margin-top:24px"><button class="primary" type="submit">Speichern</button><button type="button" onclick="modal.close()">Abbrechen</button></div></form></dialog><div class="toast" id="toast" role="status"></div><input id="importFile" type="file" accept="application/json,.json" hidden><script>
'use strict';
const KEY='zfc-office-v1', $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n/100), mini=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(n/100000000)+' Mio. €';
function seed(){return {version:1,teams:[['McLaren','#ffab53'],['Ferrari','#ff6565'],['Red Bull','#6d95ff'],['Mercedes','#60e6ca'],['Aston Martin','#6cbda7'],['Alpine','#ee8cca'],['Williams','#64a5fa'],['Haas','#ced2da'],['Audi','#ff725a'],['Cadillac','#c6bce7']].map(([name,color],i)=>({id:'team'+i,name,color,principal:'Noch nicht zugewiesen',opening:4500000000})),drivers:[],sponsors:[],transactions:[]}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();validate(db)}catch{db=seed()}let page='overview',query='';const pages={overview:'Übersicht',teams:'Teams',drivers:'Fahrer',finance:'Bank & Buchungen',sponsors:'Sponsoren',data:'Daten & Sicherung'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('Speichern fehlgeschlagen. Bitte jetzt ein JSON-Backup exportieren.');return false}}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}function team(id){return db.teams.find(t=>t.id===id)}function balance(id){return team(id).opening+db.transactions.reduce((a,t)=>a+(t.to===id?t.amount:0)-(t.from===id?t.amount:0),0)}function teamname(id){return id?team(id)?.name||'Unbekannt':'Extern'}function title(h,p,button=''){return `<div class="title"><div><div class="eyebrow">${pages[page]}</div><h1>${h}</h1><p>${p}</p></div>${button}</div>`}function addBtn(kind,text){return `<button class="primary" onclick="edit('${kind}')">＋ ${text}</button>`}function options(selected,external=false){return (external?'<option value="">Extern</option>':'')+db.teams.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}function field(name,label,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function select(name,label,value,ext=false){return `<label>${label}<select name="${name}">${options(value,ext)}</select></label>`}function controls(kind,id){return `<button onclick="edit('${kind}','${id}')">Bearbeiten</button>`}
function render(){ $('#nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');const total=db.teams.reduce((a,t)=>a+balance(t.id),0);let html='';if(page==='overview'){html=title('Deine Liga. Alles im Blick.','Das Cockpit für Teams, Fahrer und das finanzielle Geschehen.')+`<div class="hero"><div class="eyebrow" style="color:var(--accent)">TEAM OPERATIONS / 2026</div><h2>Baue starke Teams.<br>Behalte jedes Budget im Griff.</h2><p>Alle Entscheidungen beginnen mit einem klaren Überblick.</p></div><div class="stats">${[['Ligakapital',mini(total),'Summe aller Teamkonten'],['Aktive Teams',db.teams.length,'Eigene Konten & Teamchefs'],['Fahrer',db.drivers.length,'Verträge & Teamzuordnung'],['Sponsorenvolumen',mini(db.sponsors.reduce((a,s)=>a+s.amount,0)),'Erfasste Vertragswerte']].map(([a,b,c])=>`<div class="stat"><span class="muted">${a}</span><strong>${b}</strong><span class="small muted">${c}</span></div>`).join('')}</div><div class="two"><section class="panel"><div class="row"><h2>Teamvermögen</h2><button onclick="go('teams')">Alle Teams →</button></div>${[...db.teams].sort((a,b)=>balance(b.id)-balance(a.id)).slice(0,6).map(t=>`<div style="margin-top:20px"><div class="row"><span>${esc(t.name)}</span><strong>${mini(balance(t.id))}</strong></div><div class="bar" style="margin-top:9px"><span style="background:${t.color};width:${Math.max(0,balance(t.id))/Math.max(1,...db.teams.map(t=>balance(t.id)))*100}%"></span></div></div>`).join('')}</section><section class="panel"><h2>Letzte Kontobewegungen</h2>${transactions(db.transactions.slice(-5).reverse())}<div class="notice">Startklar: Teams bearbeiten, Fahrer zuweisen und den ersten Sponsorenvertrag anlegen. Alle Beispieldaten sind frei anpassbar.</div></section></div>`}
if(page==='teams'){html=title('Die Teams deiner Liga','Teamchefs, Fahrer und Kontostände an einem Ort.',addBtn('team','Team anlegen'))+`<div class="grid">${db.teams.map(t=>`<article class="card" style="--team:${t.color}"><div class="row"><div class="row"><span class="badge">${esc(t.name.slice(0,2).toUpperCase())}</span><div><h3>${esc(t.name)}</h3><span class="small muted">${esc(t.principal)}</span></div></div></div><div><div class="eyebrow">Verfügbares Budget</div><div class="balance ${balance(t.id)<0?'negative':''}">${mini(balance(t.id))}</div></div><div class="small muted">Fahrer: ${db.drivers.filter(d=>d.team===t.id).map(d=>esc(d.name)).join(', ')||'Keine zugewiesen'}<br>Sponsoren: ${db.sponsors.filter(s=>s.team===t.id).length}</div><div class="actions">${controls('team',t.id)}<button onclick="edit('transaction',null,'${t.id}')">Buchen</button></div></article>`).join('')}</div>`}
if(page==='drivers'){html=title('Fahrerkader','Verwalte Fahrer, Startnummern und Teamverträge.',addBtn('driver','Fahrer anlegen'))+`<div class="toolbar"><input placeholder="Fahrer suchen …" aria-label="Fahrer suchen" value="${esc(query)}" oninput="query=this.value;renderList()"></div><section class="panel" id="list"></section>`}
if(page==='finance'){html=title('Jede Bewegung zählt.','Nachvollziehbare Einnahmen, Ausgaben und interne Überweisungen.',addBtn('transaction','Buchung erstellen'))+`<div class="stats"><div class="stat"><span class="muted">Gesamtkapital</span><strong>${mini(total)}</strong></div><div class="stat"><span class="muted">Externe Einnahmen</span><strong class="positive">${mini(db.transactions.filter(t=>!t.from).reduce((a,t)=>a+t.amount,0))}</strong></div><div class="stat"><span class="muted">Externe Ausgaben</span><strong>${mini(db.transactions.filter(t=>!t.to).reduce((a,t)=>a+t.amount,0))}</strong></div><div class="stat"><span class="muted">Buchungen</span><strong>${db.transactions.length}</strong></div></div><section class="panel"><h2>Buchungsjournal</h2><p>Gebuchte Vorgänge bleiben erhalten. Fehler lassen sich durch eine verknüpfte Gegenbuchung korrigieren.</p>${transactions([...db.transactions].reverse(),true)}</section>`}
if(page==='sponsors'){html=title('Partnerschaften mit Wert.','Vertragswerte und Zahlungsstatus deiner Teams.',addBtn('sponsor','Sponsor erfassen'))+`<div class="grid">${db.sponsors.map(s=>`<article class="card" style="--team:${team(s.team).color}"><div class="eyebrow">${esc(teamname(s.team))}</div><h3>${esc(s.name)}</h3><div class="balance">${mini(s.amount)}</div><p>${esc(s.type)} · bis ${esc(s.end)}</p><span class="${s.paid?'positive':'muted'}">${s.paid?'● Zahlung verbucht':'○ Zahlung offen'}</span><div class="actions">${!s.paid?controls('sponsor',s.id)+`<button class="primary" onclick="pay('${s.id}')">Zahlung buchen</button>`:'<span class="small muted">Vertrag abgeschlossen</span>'}</div></article>`).join('')||'<div class="panel empty">Noch keine Sponsoren. Lege deine erste Partnerschaft an.</div>'}</div><div class="notice">Ein Vertragswert verändert den Kontostand erst, wenn du „Zahlung buchen“ auswählst. Sponsoren sind hier virtuelle Liga-Verträge.</div>`}
if(page==='data'){html=title('Deine Daten. Deine Kontrolle.','Sichere den gesamten Arbeitsstand und übertrage ihn in einen anderen Browser.')+`<div class="two"><section class="panel"><h2>Backup & Wiederherstellung</h2><p>Der JSON-Export enthält Teams, Fahrer, Sponsoren und das komplette Buchungsjournal.</p><div class="actions" style="margin-top:20px"><button class="primary" onclick="exportJSON()">JSON exportieren ↓</button><button onclick="$('#importFile').click()">JSON importieren ↑</button><button onclick="exportCSV()">Buchungen als CSV</button></div><div class="notice">Ein Import ersetzt den aktuellen Stand nach Bestätigung. Erstelle vorher ein Backup.</div></section><section class="panel"><h2>Für einen professionellen Liga-Betrieb</h2><p>Diese eigenständige HTML-Datei benötigt keine Installation. Sie funktioniert auch auf GitHub Pages.</p><p style="margin-top:16px">Für mehrere Admins: Datenbank, serverseitiger Login, Rollen für CEO / Tier 2 / Teamchef, Freigaben für große Zahlungen und ein unveränderbares Audit-Protokoll ergänzen.</p><div class="notice">Die lokale Version hat keinen Zugriffsschutz und keine Synchronisation. Verwende sie für virtuelle Ligabudgets; trage keine echten Bankzugänge ein.</div></section></div>`}$('#app').innerHTML=html;if(page==='drivers')renderList()}
function go(p){page=p;query='';render()}function transactions(items,full=false){return items.length?`<div class="table-wrap"><table><thead><tr><th>Datum / Zweck</th><th>Von → An</th><th>Betrag</th>${full?'<th>Aktion</th>':''}</tr></thead><tbody>${items.map(t=>`<tr><td><strong>${esc(t.note)}</strong><br><span class="muted small">${new Date(t.at).toLocaleString('de-DE')}</span></td><td>${esc(teamname(t.from))} → ${esc(teamname(t.to))}</td><td style="white-space:nowrap">${money(t.amount)}</td>${full?`<td>${t.reversalOf||db.transactions.some(x=>x.reversalOf===t.id)?'<span class="muted small">Gegenbuchung erfasst</span>':`<button onclick="reverse('${t.id}')">Stornieren</button>`}</td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Noch keine Buchungen vorhanden.</div>'}
function renderList(){const ds=db.drivers.filter(d=>(d.name+' '+teamname(d.team)).toLowerCase().includes(query.toLowerCase()));$('#list').innerHTML=ds.length?`<div class="table-wrap"><table><thead><tr><th>Fahrer</th><th>Team</th><th>Nr.</th><th>Gehalt / Saison</th><th>Vertrag bis</th><th></th></tr></thead><tbody>${ds.map(d=>`<tr><td><strong>${esc(d.name)}</strong><br><span class="muted">${esc(d.discord)}</span></td><td>${esc(teamname(d.team))}</td><td>${d.number}</td><td>${money(d.salary)}</td><td>${esc(d.end)}</td><td>${controls('driver',d.id)} <button onclick="removeDriver('${d.id}')">Entfernen</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Keine Fahrer gefunden. Lege deinen ersten Fahrer an.</div>'}
function edit(kind,id,preteam){const list={team:'teams',driver:'drivers',sponsor:'sponsors'}[kind];const obj=id?db[list].find(x=>x.id===id):{};const o=obj||{};$('#modalTitle').textContent={team:'Team verwalten',driver:'Fahrer verwalten',sponsor:'Sponsorenvertrag',transaction:'Neue Buchung'}[kind];$('#error').textContent='';let h='';if(kind==='team')h=field('name','Teamname',o.name||'','text','required maxlength="60"')+field('principal','Teamchef',o.principal||'','text','required maxlength="80"')+field('color','Teamfarbe',o.color||'#c7f36b','color')+(id?'<p>Das Startkapital ist nach der Anlage fest. Budgetänderungen erfolgen über Buchungen.</p>':field('opening','Startkapital in €',45000000,'number','required min="0" max="1000000000" step="0.01"'));
if(kind==='driver')h=field('name','Fahrername',o.name||'','text','required maxlength="80"')+field('discord','Discord / EA-ID',o.discord||'','text','maxlength="80"')+select('team','Team',o.team)+`<div class="formgrid">`+field('number','Startnummer',o.number??1,'number','required min="0" max="999" step="1"')+field('salary','Gehalt pro Saison in €',o.salary/100||0,'number','required min="0" max="1000000000" step="0.01"')+'</div>'+field('end','Vertrag bis',o.end||'2026-12-31','date','required')+'<p>Das Gehalt wird erfasst. Die Auszahlung erfolgt separat als Buchung.</p>';
if(kind==='sponsor')h=field('name','Sponsorname',o.name||'','text','required maxlength="80"')+select('team','Team',o.team)+field('type','Vertragsart',o.type||'Hauptsponsor','text','required maxlength="60"')+field('amount','Vertragswert in €',o.amount/100||1000000,'number','required min="0.01" max="1000000000" step="0.01"')+field('end','Laufzeit bis',o.end||'2026-12-31','date','required');
if(kind==='transaction')h=select('from','Von (Belastung)',preteam||'',true)+select('to','An (Gutschrift)','',true)+field('amount','Betrag in €','','number','required min="0.01" max="1000000000" step="0.01"')+field('note','Verwendungszweck','','text','required maxlength="140"')+'<p>Extern → Team: Einnahme · Team → Extern: Ausgabe · Team → Team: Überweisung</p>';
$('#fields').innerHTML=h;$('#form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{if(kind==='team'){if(db.teams.some(t=>t.id!==id&&t.name.toLowerCase()===f.name.trim().toLowerCase()))throw Error('Teamname bereits vorhanden.');if(id)Object.assign(o,{name:f.name.trim(),principal:f.principal.trim(),color:f.color});else db.teams.push({id:uid(),name:f.name.trim(),principal:f.principal.trim(),color:f.color,opening:cents(f.opening,true)})}if(kind==='driver'){if(db.drivers.some(d=>d.id!==id&&d.number===Number(f.number)))throw Error('Diese Startnummer ist bereits vergeben.');const v={name:f.name.trim(),discord:f.discord.trim(),team:f.team,number:Number(f.number),salary:cents(f.salary,true),end:f.end};if(!v.name)throw Error('Bitte einen Namen angeben.');if(id)Object.assign(o,v);else db.drivers.push({id:uid(),...v})}if(kind==='sponsor'){const v={name:f.name.trim(),team:f.team,type:f.type.trim(),amount:cents(f.amount),end:f.end};if(!v.name)throw Error('Bitte einen Namen angeben.');if(id)Object.assign(o,v);else db.sponsors.push({id:uid(),...v,paid:false})}if(kind==='transaction')book(f.from,f.to,cents(f.amount),f.note.trim());save();modal.close();render();toast('Gespeichert')}catch(err){$('#error').textContent=err.message}};modal.showModal()}
function cents(v,zero=false){const n=Math.round(Number(v)*100);if(!Number.isSafeInteger(n)||n<(zero?0:1)||n>100000000000)throw Error('Bitte einen gültigen Betrag angeben.');return n}function book(from,to,amount,note,extra={}){if(from===to)throw Error('Absender und Empfänger müssen unterschiedlich sein.');if(!note)throw Error('Bitte einen Verwendungszweck angeben.');if(from&&balance(from)<amount)throw Error('Das Team hat nicht genügend Guthaben.');db.transactions.push({id:uid(),at:new Date().toISOString(),from,to,amount,note,...extra})}function pay(id){const s=db.sponsors.find(s=>s.id===id);if(s.paid)return;if(!confirm(`${money(s.amount)} für ${teamname(s.team)} als Sponsoring-Einnahme buchen?`))return;book('',s.team,s.amount,'Sponsoring: '+s.name,{sponsorId:id});s.paid=true;save();render();toast('Sponsorenzahlung verbucht')}function reverse(id){const t=db.transactions.find(t=>t.id===id);if(t.reversalOf||db.transactions.some(x=>x.reversalOf===id))return;if(!confirm('Diese Buchung durch eine Gegenbuchung stornieren?'))return;try{book(t.to,t.from,t.amount,'Storno: '+t.note,{reversalOf:id});if(t.sponsorId){const s=db.sponsors.find(s=>s.id===t.sponsorId);if(s)s.paid=false}save();render();toast('Gegenbuchung erstellt')}catch(e){alert(e.message)}}function removeDriver(id){if(confirm('Diesen Fahrer aus dem Kader entfernen?')){db.drivers=db.drivers.filter(d=>d.id!==id);save();render()}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJSON(){download('zfc-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){const cell=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Datum','Von','An','Betrag EUR','Verwendungszweck'],...db.transactions.map(t=>[t.at,teamname(t.from),teamname(t.to),(t.amount/100).toFixed(2),t.note])];download('zfc-buchungen.csv','\uFEFF'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function validate(d){if(!d||d.version!==1||!['teams','drivers','sponsors','transactions'].every(k=>Array.isArray(d[k])))throw Error('Ungültiges Backup-Format.');if(!d.teams.length||d.teams.length>100||d.drivers.length>2000||d.sponsors.length>5000||d.transactions.length>50000)throw Error('Ungültige Datensatzanzahl.');const ids=new Set();const str=(s,n=200)=>typeof s==='string'&&s.length<=n;const amount=n=>Number.isSafeInteger(n)&&n>=0&&n<=100000000000;for(const a of [d.teams,d.drivers,d.sponsors,d.transactions])for(const o of a){if(!o||!str(o.id,100)||!o.id||ids.has(o.id))throw Error('Ungültige IDs.');ids.add(o.id)}const ts=new Set(d.teams.map(t=>t.id));for(const t of d.teams)if(!str(t.name)||!t.name.trim()||!str(t.principal)||!/^#[a-f0-9]{6}$/i.test(t.color)||!amount(t.opening))throw Error('Ungültiges Team.');for(const r of d.drivers)if(!str(r.name)||!str(r.discord)||!ts.has(r.team)||!amount(r.salary)||!Number.isInteger(r.number)||r.number<0||r.number>999||!/^\d{4}-\d{2}-\d{2}$/.test(r.end))throw Error('Ungültiger Fahrer.');for(const s of d.sponsors)if(!str(s.name)||!str(s.type)||!ts.has(s.team)||!amount(s.amount)||s.amount===0||typeof s.paid!=='boolean'||!/^\d{4}-\d{2}-\d{2}$/.test(s.end))throw Error('Ungültiger Sponsor.');const txids=new Set(d.transactions.map(t=>t.id));for(const t of d.transactions)if(!amount(t.amount)||!t.amount||!(t.from===''||ts.has(t.from))||!(t.to===''||ts.has(t.to))||t.from===t.to||!str(t.note)||!Number.isFinite(Date.parse(t.at))||(t.reversalOf&&!txids.has(t.reversalOf))||(t.sponsorId&&!d.sponsors.some(s=>s.id===t.sponsorId)))throw Error('Ungültige Buchung.');const balances=new Map(d.teams.map(t=>[t.id,t.opening]));for(const t of d.transactions){if(t.from)balances.set(t.from,balances.get(t.from)-t.amount);if(t.to)balances.set(t.to,balances.get(t.to)+t.amount)}if([...balances.values()].some(n=>!Number.isSafeInteger(n)||n<0))throw Error('Ungültige Kontostände.');}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>15000000)throw Error('Backup ist zu groß (max. 15 MB).');const data=JSON.parse(await file.text());validate(data);if(confirm('Aktuellen Datenstand vollständig durch dieses Backup ersetzen?')){db=data;save();render();toast('Backup importiert')}}catch(err){alert('Import abgebrochen: '+err.message)}e.target.value=''};render();
</script></body></html>
